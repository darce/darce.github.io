<rect x="312" y="160" width="148.8" height="32" fill="#d9253f"/>
<rect x="79.2" y="202" width="208.8" height="32" fill="#3c00f7"/>
<rect x="312" y="202" width="96" height="32" fill="#d9253f"/>
<rect x="184.8" y="244" width="103.2" height="32" fill="#3c00f7"/>
<rect x="312" y="244" width="201.6" height="32" fill="#d9253f"/>
<rect x="132" y="286" width="156" height="32" fill="#3c00f7"/>
<rect x="312" y="286" width="86.4" height="32" fill="#d9253f"/>
<rect x="216" y="328" width="72" height="32" fill="#3c00f7"/>
