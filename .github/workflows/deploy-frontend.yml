name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NEXT_PUBLIC_ALTCTX_BACKEND_URL: https://marketing-altcontext.fly.dev

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js, cache dependencies, install dependencies
        uses: ./.github/workflows/setup-node

      - name: Cache derived image variants
        uses: actions/cache@v4
        with:
          path: |
            public/images/_gen
            lib/generated
          key: image-variants-${{ hashFiles('public/images/**', 'scripts/generate-image-variants.js') }}

      - name: Typecheck
        run: npm run check

  build:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so sitemap lastmod derives from per-file commit dates
          # instead of collapsing to the HEAD commit on a shallow clone.
          fetch-depth: 0

      - name: Setup Node.js, cache dependencies, install dependencies
        uses: ./.github/workflows/setup-node

      - name: Cache derived image variants
        uses: actions/cache@v4
        with:
          path: |
            public/images/_gen
            lib/generated
          key: image-variants-${{ hashFiles('public/images/**', 'scripts/generate-image-variants.js') }}

      - name: Setup pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next
          enablement: true

      - name: Build with Next.js
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
